name: Build and Push to Appleby Cloud Registry

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: [self-hosted, lattice-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The host's shared BuildKit, not docker/setup-buildx-action: that races
      # with other runners on the shared Docker daemon. Its local layer cache
      # persists between builds, so there is no gha cache (it fails through a
      # remote builder anyway).
      - name: Use lattice-builder
        run: |
          docker buildx inspect lattice-builder >/dev/null 2>&1 \
            || docker buildx create --name lattice-builder --driver remote tcp://127.0.0.1:1234
          docker buildx inspect lattice-builder

      # Network retries: registry.appleby.cloud and Lattice sit on-prem behind
      # Cloudflare on one WAN, and ~5% of requests time out or 522. Every call
      # to them below makes 5 attempts (5s, 10s, 20s, 40s apart) and fails at
      # once on an auth/4xx answer.
      #
      # Shell login, not docker/login-action (which has no retry). Writes the
      # same ~/.docker/config.json that buildx and `docker push` read.
      - name: Log in to Appleby Cloud Registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" \
                -u "$REGISTRY_USERNAME" --password-stdin > login.log 2>&1; then
              cat login.log
              exit 0
            fi
            cat login.log
            if grep -qiE 'unauthorized|incorrect username|denied|forbidden' login.log; then
              echo "::error title=Registry login refused::credentials rejected - not retrying"
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((5 * 2 ** (attempt - 1)))
              echo "::warning title=Registry login retry::attempt $attempt/5 failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Registry unreachable::docker login failed after 5 attempts"
          exit 1

      # Build only (load into the runner's daemon); the push is its own step
      # so a network blip retries the push, not the whole build.
      # provenance: false - the docker exporter cannot carry attestations,
      # so the pushed tag is a plain single-platform manifest.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          builder: lattice-builder
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:latest

      # Layers that already reached the registry are skipped on a retry
      # ("Layer already exists"), so a retry only re-sends what was lost.
      # shell: bash (not the implicit `bash -e`) so pipefail is on and a failed
      # `docker push` is not masked by `tee`'s exit status.
      - name: Push image
        shell: bash
        env:
          TAGS: ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:latest
        run: |
          for tag in $TAGS; do
            for attempt in 1 2 3 4 5; do
              if docker push "$tag" 2>&1 | tee push.log; then
                continue 2
              fi
              if grep -qiE 'unauthorized|denied|forbidden|name unknown|manifest invalid' push.log; then
                echo "::error title=Registry refused the push::$tag - not retrying"
                exit 1
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "::warning title=Registry push retry::$tag attempt $attempt/5 failed; retrying in ${delay}s"
                sleep "$delay"
              fi
            done
            echo "::error title=Registry unreachable::push of $tag failed after 5 attempts"
            exit 1
          done


  # Redeploys every OpenBucket instance by firing ONE Lattice automation,
  # "Redeploy OpenBucket" (automation id 2): hillview-openbucket (stack 42),
  # aplb-openbucket (24), trailblaze-openbucket (26), in that order. A deploy
  # token reaches one stack only; the automation is the instance list, so a new
  # instance is a new step there, not a change here. Same contract as
  # monitor-core's deploy job.
  #
  # A GREEN RUN MEANS LATTICE ACCEPTED THE REDEPLOYS, NOT THAT THEY LANDED. No
  # step waits for its container. Check the automation's run history
  # (lattice_list_automation_runs) or each instance's logs.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lattice-worker]
    # The automation refuses a firing while its previous run holds the run
    # guard (409) instead of queueing it, so queue overlapping deploys here.
    concurrency:
      group: openbucket-deploy
      cancel-in-progress: false
    steps:
      - name: Fire the Lattice automation
        env:
          DEPLOY_URL: ${{ secrets.LATTICE_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=No deploy credential::LATTICE_DEPLOY_URL is not set. It must hold the webhook URL of the Lattice automation \"Redeploy OpenBucket\"."
            exit 1
          fi

          # Synchronous: Lattice runs every step before it answers (50s run
          # budget under its 60s write timeout).
          HTTP=$(curl -sS -X POST "$DEPLOY_URL?commit=${{ github.sha }}" \
            --max-time 75 -o response.json -w '%{http_code}') || {
            echo "::error title=Lattice unreachable::The automation webhook did not answer (curl exit $?)."
            exit 1
          }

          RESULT=$(jq -r '.data.result // empty' response.json 2>/dev/null || true)
          MESSAGE=$(jq -r '[.message, .error, .error_message] | map(select(. != null and . != "")) | unique | join(" — ")' response.json 2>/dev/null || true)
          jq -r '.data.run.steps[]? | "  \(.type) → \(.status): \(.summary)\(if .error then " (\(.error))" else "" end)"' response.json 2>/dev/null || true

          # HTTP 200 IS NOT SUCCESS: a disabled automation answers 200 with
          # result "disabled" and runs nothing. 409 = skipped, 424 = failed.
          if [ "$HTTP" = "200" ] && [ "$RESULT" = "succeeded" ]; then
            echo "Lattice: $MESSAGE"
            echo "- 🚀 Lattice: $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DETAIL=${MESSAGE:-"no JSON body. Check that LATTICE_DEPLOY_URL is the automation's webhook URL rather than its dashboard page."}
          echo "::error title=Automation did not succeed::HTTP $HTTP, result '${RESULT:-none}': $DETAIL"
          echo "- ❌ Lattice: HTTP $HTTP, result \`${RESULT:-none}\` — $DETAIL" >> "$GITHUB_STEP_SUMMARY"
          exit 1
